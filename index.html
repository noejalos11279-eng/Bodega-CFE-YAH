<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CFE Bodega - Acceso</title>
  <style>
    body { font-family: Arial, sans-serif; background: #f3f6f4; margin: 0; padding: 16px; color: #1c2420; }
    .box { max-width: 420px; margin: 24px auto; background: #fff; border: 1px solid #d5dfd9; border-radius: 10px; padding: 18px; }
    .header { background: #006837; color: #fff; padding: 14px; border-radius: 8px; margin-bottom: 16px; }
    .header h1 { margin: 0; font-size: 18px; }
    .header p { margin: 4px 0 0; font-size: 12px; }
    label { display: block; font-size: 12px; font-weight: bold; margin-top: 12px; margin-bottom: 4px; }
    input { width: 100%; padding: 10px; font-size: 15px; border: 1px solid #b8c7be; border-radius: 6px; box-sizing: border-box; }
    button { width: 100%; margin-top: 16px; padding: 12px; font-size: 15px; font-weight: bold; background: #006837; color: #fff; border: none; border-radius: 6px; cursor: pointer; }
    #msg { margin-top: 12px; font-size: 13px; padding: 10px; border-radius: 6px; background: #eef3f0; white-space: pre-wrap; }
    .panel { display: none; margin-top: 16px; padding-top: 14px; border-top: 1px solid #d5dfd9; }
  </style>
</head>
<body>
  <div class="box">
    <div class="header">
      <h1>CFE BODEGA</h1>
      <p>Zona Altos / Área Yahualica</p>
    </div>

    <div id="login-form">
      <label for="rp">RPE</label>
      <input id="rp" type="text" placeholder="RPE DE USUARIO" />

      <label for="pass">Contraseña</label>
      <input id="pass" type="password" placeholder="Contraseña" />

      <button id="btn-entrar" type="button" onclick="entrar()">Entrar al Sistema</button>
      <div id="msg">Listo para iniciar sesión.</div>
    </div>

    <div id="panel" class="panel">
      <h2 id="bienvenida" style="margin:0 0 8px; font-size:17px; color:#006837;"></h2>
      <p id="datos-rol" style="margin:0 0 12px; font-size:14px;"></p>
      <button type="button" onclick="salir()" style="background:#444;">Cerrar sesión</button>
    </div>
  </div>

  <script>
    const SUPABASE_URL = "https://smhjvpjtjivzpzuwoahc.supabase.co";
    const SUPABASE_KEY = "sb_publishable_W6OAZHsvc5pBSSmAXLGwhA_hFnloN1H";

    async function entrar() {
      const msg = document.getElementById("msg");
      const rp = document.getElementById("rp").value.trim();
      const pass = document.getElementById("pass").value;

      if (!rp || !pass) {
        msg.textContent = "Escribe tu RPE y tu contraseña.";
        return;
      }

      msg.textContent = "Consultando base de datos en la nube...";

      try {
        const url = SUPABASE_URL + "/rest/v1/perfiles?rp=eq." + encodeURIComponent(rp) + "&password=eq." + encodeURIComponent(pass) + "&activo=eq.true&select=*";
        const res = await fetch(url, {
          headers: {
            "apikey": SUPABASE_KEY,
            "Authorization": "Bearer " + SUPABASE_KEY
          }
        });

        const texto = await res.text();
        if (!res.ok) {
          msg.textContent = "Error HTTP " + res.status + ":\n" + texto;
          return;
        }

        const filas = JSON.parse(texto);
        if (!Array.isArray(filas) || filas.length === 0) {
          msg.textContent = "No se encontró el usuario con ese RPE y contraseña (o está inactivo).";
          return;
        }

        const user = filas[0];
        document.getElementById("login-form").style.display = "none";
        document.getElementById("panel").style.display = "block";
        document.getElementById("bienvenida").textContent = "Bienvenido, " + user.nombre;
        document.getElementById("datos-rol").textContent = "RPE: " + user.rp + " | Rol: " + user.rol;
      } catch (err) {
        msg.textContent = "Error de red o conexión:\n" + (err.message || err);
      }
    }

    function salir() {
      document.getElementById("panel").style.display = "none";
      document.getElementById("login-form").style.display = "block";
      document.getElementById("pass").value = "";
      document.getElementById("msg").textContent = "Sesión cerrada.";
    }
  </script>
